name: Update Poland Energy news feed

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes (UTC)
  workflow_dispatch:            # "Run workflow" button for manual refresh

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch, translate and merge latest news
        env:
          DATA_PATH: data/signals.json   # must match the file index.html fetches
        run: python scripts/fetch_news.py
      - name: Commit updated feed
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new articles."
          else
            git commit -m "Live feed update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
