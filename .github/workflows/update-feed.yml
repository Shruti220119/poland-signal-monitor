name: Update signal feed
on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes (UTC)
  workflow_dispatch:            # "Run workflow" button for a manual refresh
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Fetch sources
        env:
          AZURE_OPENAI_ENDPOINT:   ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY:        ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        run: python feed_fetcher.py
      - name: Commit signals.json if changed
        run: |
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add signals.json
          git diff --cached --quiet || git commit -m "Feed update $(date -u +%FT%TZ)"
          git push
